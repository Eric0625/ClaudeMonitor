name: ClaudeMonitor
options:
  bundleIdPrefix: com.ericyuan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ClaudeMonitorCore:
    path: Packages/ClaudeMonitorCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: WS7X3S9H5W
    CODE_SIGN_STYLE: Automatic
targets:
  ClaudeMonitor:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ClaudeMonitorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericyuan.ClaudeMonitor
        PRODUCT_NAME: ClaudeMonitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Claude Monitor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  ClaudeMonitor:
    build:
      targets:
        ClaudeMonitor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClaudeMonitorCore/ClaudeMonitorCoreTests
    archive:
      config: Release
